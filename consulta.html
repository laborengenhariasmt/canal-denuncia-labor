<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Consultar Protocolo</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>
    #paginaConsulta,
    #paginaCarregando,
    #paginaErro {
      display: none;
    }

    #paginaCarregando {
      display: block;
    }

    .logo-empresa {
      display: none;
      max-width: 280px;
      max-height: 150px;
      object-fit: contain;
      margin: 0 auto 24px;
    }
  </style>
</head>

<body>

<div id="paginaCarregando">

  <main class="container">
    <section class="card">
      <h2>Carregando canal...</h2>
    </section>
  </main>

</div>

<div id="paginaErro">

  <header class="hero">
    <h1>Canal indisponível</h1>
  </header>

  <main class="container">
    <section class="card">

      <h2>Não foi possível abrir esta consulta</h2>

      <p id="mensagemErroEmpresa">
        Empresa não encontrada ou canal desativado.
      </p>

    </section>
  </main>

</div>

<div id="paginaConsulta">

  <header class="hero" id="cabecalhoEmpresa">

    <img
      id="logoEmpresa"
      class="logo logo-empresa"
      alt="Logomarca da empresa"
    >

    <h1 id="tituloConsulta">
      Consultar Protocolo
    </h1>

    <p class="subtitulo" id="subtituloConsulta">
      Consulte o andamento do relato utilizando o número de protocolo.
    </p>

  </header>

  <main class="container">

    <section class="card">

      <h2>Acompanhar ocorrência</h2>

      <form id="consultaForm">

        <label for="protocoloConsulta">
          Número do protocolo
        </label>

        <input
          type="text"
          id="protocoloConsulta"
          placeholder="Digite o protocolo recebido"
          autocomplete="off"
          required
        >

        <button
          type="submit"
          id="botaoConsultar"
        >
          Consultar protocolo
        </button>

      </form>

      <div
        id="resultadoConsulta"
        style="margin-top: 25px;"
      ></div>

      <p style="margin-top: 30px;">

        <a id="linkVoltarCanal" href="#">
          Voltar ao Canal de Denúncias
        </a>

      </p>

    </section>

  </main>

</div>

<script src="/js/consulta.js"></script>

</body>
</html>
