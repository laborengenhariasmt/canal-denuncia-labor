<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel de Denúncias | Labor</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="hero">
  <img
    src="/assets/logo-labor.png"
    alt="Labor Engenharia"
    class="logo"
  >

  <h1>Painel Interno de Denúncias</h1>

  <p class="subtitulo">
    Área restrita para acompanhamento das ocorrências registradas.
  </p>
</header>

<main class="container">

  <section class="card" id="loginCard">

    <h2>Acesso Restrito</h2>

    <form id="loginForm">

      <label for="usuario">
        Usuário
      </label>

      <input
        type="text"
        id="usuario"
        placeholder="Digite o usuário"
        autocomplete="username"
        required
      >

      <label for="senha">
        Senha
      </label>

      <input
        type="password"
        id="senha"
        placeholder="Digite a senha"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="botaoLogin">
        Entrar
      </button>

    </form>

    <p
      id="erroLogin"
      style="color: red; margin-top: 15px;"
    ></p>

  </section>

  <section
    class="card"
    id="painelCard"
    style="display: none;"
  >

    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        flex-wrap: wrap;
      "
    >
      <div>
        <h2>Denúncias Recebidas</h2>

        <p id="dadosUsuarioLogado"></p>
      </div>

      <button
        type="button"
        onclick="sair()"
        style="background: #555;"
      >
        Sair
      </button>
    </div>

    <div
      id="resumoDenuncias"
      class="dashboard-resumo"
    ></div>

    <label for="filtroStatus">
      Filtrar por Status
    </label>

    <select
      id="filtroStatus"
      onchange="aplicarFiltroStatus()"
    >
      <option value="Todos">Todos</option>
      <option value="Recebida">Recebida</option>
      <option value="Em análise">Em análise</option>
      <option value="Em investigação">Em investigação</option>
      <option value="Concluída">Concluída</option>
      <option value="Arquivada">Arquivada</option>
    </select>

    <button
      type="button"
      onclick="carregarDenuncias()"
    >
      Atualizar Lista
    </button>

    <div
      id="listaDenuncias"
      style="margin-top: 25px;"
    ></div>

  </section>

</main>

<div id="modalDetalhes" class="modal">
  <div class="modal-conteudo">

    <button
      type="button"
      class="modal-fechar"
      onclick="fecharDetalhes()"
    >
      Fechar
    </button>

    <div id="conteudoDetalhes"></div>

  </div>
</div>

<script src="/js/admin.js"></script>

</body>
</html>
